<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- محركات البحث والـ SEO (اللي ما ينفعش ننساها) -->
    <title>MyFlix | مشاهدة الأفلام والمسلسلات مجاناً</title>
    <meta name="description" content="شاهد أحدث الأفلام والمسلسلات بجودة عالية مترجمة اون لاين.">
    <meta name="keywords" content="أفلام, مسلسلات, مشاهدة اون لاين, افلام مترجمة">
    <link rel="canonical" href="https://sex-up.github.io/World-Sex/">

    <!-- مكتبة الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
        :root {
            --bg-color: #000000;
            --header-bg: #1a1a1a;
            --accent-color: #ffa31a;
            --text-color: #ffffff;
            --card-bg: #141414;
            --sidebar-bg: #111111;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
        }

        /* --- الهيدر العلوي --- */
        header {
            background-color: var(--header-bg);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-color);
            position: sticky;
            top: 0;
            z-index: 100;
            height: 70px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 24px;
            cursor: pointer;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: var(--text-color);
            text-decoration: none;
        }

        .logo span {
            background-color: var(--accent-color);
            color: black;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* زر تسجيل الدخول بجوجل */
        .google-login-btn {
            background: white;
            color: #333;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            transition: 0.3s;
        }

        .google-login-btn:hover {
            background: #f1f1f1;
        }

        .google-login-btn i {
            color: #4285F4;
            font-size: 16px;
        }

        /* --- القائمة الجانبية (Sidebar) --- */
        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 101;
            top: 0;
            right: 0;
            background-color: var(--sidebar-bg);
            overflow-x: hidden;
            transition: 0.3s;
            padding-top: 80px;
            border-left: 1px solid #333;
        }

        .sidebar a {
            padding: 12px 25px;
            text-decoration: none;
            font-size: 18px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.2s;
        }

        .sidebar a:hover {
            background-color: var(--accent-color);
            color: black;
        }

        .sidebar .close-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 25px;
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
        }

        /* --- المحتوى الرئيسي والأقسام --- */
        .main-content {
            padding: 20px;
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 15px;
            border-right: 4px solid var(--accent-color);
            padding-right: 10px;
            color: var(--text-color);
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .movie-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #222;
        }

        .movie-poster {
            width: 100%;
            height: 200px;
            background-color: #222;
            object-fit: cover;
        }

        .movie-info {
            padding: 10px;
        }

        .movie-title {
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
</style>
  </head>
  <body>

    <!-- الهيدر -->
    <header>
	  <button class="menu-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
	  <a href="#" class="logo">My<span>Flix</span></a>

	  <!-- زر تسجيل الدخول بجوجل -->
	  <button class="google-login-btn" onclick="loginWithGoogle()">
		<i class="fa-brands fa-google"></i> دخول
	  </button>
    </header>

    <!-- القائمة الجانبية -->
    <div id="mySidebar" class="sidebar">
	  <button class="close-btn" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
	  <a href="#"><i class="fa-solid fa-house"></i> الرئيسية</a>
	  <a href="#"><i class="fa-solid fa-film"></i> الأفلام</a>
	  <a href="#"><i class="fa-solid fa-tv"></i> المسلسلات</a>
	  <a href="#"><i class="fa-solid fa-fire"></i> الأكثر مشاهدة</a>
	  <a href="#"><i class="fa-solid fa-heart"></i> المفضلة</a>
    </div>

    <!-- المحتوى والأقسام -->
    <div class="main-content">

	  <!-- قسم الأفلام الرائجة -->
	  <div class="section-title">أحدث الأفلام</div>
	  <div class="movies-grid">
		<div class="movie-card">
		  <div class="movie-poster"></div>
		  <div class="movie-info"><div class="movie-title">اسم الفيلم هنا</div></div>
		</div>
		<div class="movie-card">
		  <div class="movie-poster"></div>
		  <div class="movie-info"><div class="movie-title">اسم الفيلم هنا</div></div>
		</div>
	  </div>

	  <!-- قسم المسلسلات -->
	  <div class="section-title">أحدث المسلسلات</div>
	  <div class="movies-grid">
		<div class="movie-card">
		  <div class="movie-poster"></div>
		  <div class="movie-info"><div class="movie-title">اسم المسلسل هنا</div></div>
		</div>
	  </div>

    </div>

    <!-- كود الجافاسكريبت المدمج جوه الصفحة -->
<script>
        function toggleSidebar() {
            const sidebar = document.getElementById("mySidebar");
            if (sidebar.style.width === "250px") {
                sidebar.style.width = "0";
            } else {
                sidebar.style.width = "250px";
            }
        }

        function loginWithGoogle() {
            alert("سيتم توجيهك لتسجيل الدخول بحساب جوجل قريبًا.");
        }
</script>
  </body>
</html>
