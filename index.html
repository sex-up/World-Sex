<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- عنوان ووصف الموقع لمحركات البحث (SEO) -->
    <title>MyFlix | مشاهدة الأفلام والمسلسلات مجاناً</title>
    <meta name="description" content="شاهد أحدث الأفلام والمسلسلات بجودة عالية مترجمة اون لاين.">
    <meta name="keywords" content="أفلام, مسلسلات, مشاهدة اون لاين, افلام مترجمة">
    <link rel="canonical" href="https://mohamedsaadq347-ai.github.io/World-Sex/">

<style>
        :root {
            --bg-color: #000000;
            --header-bg: #1a1a1a;
            --accent-color: #ffa31a;
            --text-color: #ffffff;
            --card-bg: #141414;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
        }

        /* --- الهيدر (ثابت) --- */
        header {
            background-color: var(--header-bg);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-color);
            position: sticky;
            top: 0;
            z-index: 100;
            height: 70px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;
            color: var(--text-color);
            display: flex;
            align-items: center;
        }

        .logo span {
            background-color: var(--accent-color);
            color: black;
            padding: 2px 6px;
            border-radius: 4px;
            margin: 0 4px;
        }

        .search-container {
            flex-grow: 1;
            max-width: 400px;
            margin: 0 15px;
        }

        #searchInput {
            width: 100%;
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid #333;
            background-color: #252525;
            color: white;
            outline: none;
            font-size: 14px;
        }

        #langToggle {
            background-color: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        /* --- الحاوية العامة للقوائم --- */
        main {
            padding-bottom: 30px;
        }

        /* تنسيق مشترك لقائمة الفيديوهات (الرئيسية والمقترحات) */
        .movies-list-container {
            display: flex;
            flex-direction: column;
            gap: 15px; /* المسافة بين الفيديوهات */
            padding: 15px;
            width: 100%;
            max-width: 800px; /* تحديد أقصى عرض لتبدو جيدة على الشاشات الكبيرة */
            margin: 0 auto; /* توسيط القائمة في الشاشات الكبيرة */
        }

        /* --- "الصفحة" الرئيسية --- */
        #homePage {
            padding: 20px 0;
        }

        /* --- "صفحة" المشغل --- */
        #playerPage {
            display: none; /* مخفية افتراضياً */
            flex-direction: column;
            width: 100%;
        }

        /* حاوية المشغل فوق خالص (ثابتة عند السكرول) */
        .video-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: black;
            position: sticky;
            top: 70px; /* تحت الهيدر */
            z-index: 90;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* معلومات الفيديو تحت المشغل */
        .player-details {
            padding: 15px;
            background-color: #0a0a0a;
            border-bottom: 1px solid #222;
        }

        #playerTitle {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-color);
        }

        /* عنوان قسم الفيديوهات المقترحة */
        .suggestions-title {
            padding: 15px 15px 5px 15px;
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- تنسيق كارت الفيديو الموحد (العريض جداً) --- */
        .movie-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #222;
            cursor: pointer;
            width: 100%; /* ملء عرض الحاوية */
            transition: transform 0.2s, border-color 0.2s;
        }

        .movie-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-color);
        }

        /* حاوية الصورة للحفاظ على الأبعاد */
        .thumbnail-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9; /* أبعاد الفيديو القياسية */
            overflow: hidden;
            position: relative;
        }

        .thumbnail-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* تغطية المساحة بالكامل دون تشويه */
            display: block;
        }
        
        /* أيقونة تشغيل صغيرة فوق الصورة (اختياري) */
        .thumbnail-wrapper::after {
            content: '▶';
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: rgba(0,0,0,0.7);
            color: var(--accent-color);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
        }

        /* معلومات الفيديو تحت الصورة */
        .movie-info {
            padding: 12px 15px;
        }

        .movie-title {
            font-size: 15px;
            font-weight: 600;
            color: #efefef;
            /* السماح بالعنوان بالظهور على سطرين إذا كان طويلاً */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo" id="logoLink">My<span>Flix</span></a>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="ابحث عن فيلم أو مسلسل...">
        </div>
        <button id="langToggle">English</button>
    </header>

    <main>
        <!-- --- "الصفحة" الرئيسية (الآن أصبحت قائمة رأسية) --- -->
        <div id="homePage">
            <div class="movies-list-container" id="homeList">
                <!-- الفيديوهات ستظهر هنا بتحت بعض (كبيرة وعريضة) -->
            </div>
        </div>

        <!-- --- "صفحة" المشغل --- -->
        <div id="playerPage">
            <!-- المشغل فوق خالص وثابت -->
            <div class="video-container" id="videoContainer">
                <!-- الـ iframe سيوضع هنا بالجافاسكربت -->
            </div>
            
            <!-- معلومات الفيديو الحالي -->
            <div class="player-details">
                <div id="playerTitle">اسم الفيديو</div>
            </div>

            <!-- عنوان المقترحات -->
            <div class="suggestions-title" id="suggestionsTitle">فيديوهات قد تعجبك</div>

            <!-- قائمة الفيديوهات المقترحة (تحت بعض) -->
            <div class="movies-list-container" id="suggestionsList">
                <!-- الفيديوهات المقترحة ستظهر هنا -->
            </div>
        </div>
    </main>

    <script>
        // --- قسم البيانات (أكواد Abyss حقيقية) ---
        const allMovies = [
            { id: 1, titleAr: "بريكنج باد - الحلقة 1 (تجربة مشغل Abyss الحقيقي)", titleEn: "Breaking Bad - S01E01 (Abyss Player Test)", image: "https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=500&q=80", embed: '<iframe src="https://abyssplayer.com/e/pSOrU_D_-o4k" width="100%" height="100%" frameborder="0" scrolling="no" allowfullscreen></iframe>' },
            { id: 2, titleAr: "فيلم هوم ألون - كامل بجودة عالية", titleEn: "Home Alone - Full Movie HD", image: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500&q=80", embed: '<iframe src="https://www.youtube.com/embed/HhesaQXLuRY" allowfullscreen></iframe>' },
            { id: 3, titleAr: "فارس الظلام - الإعلان الرسمي", titleEn: "The Dark Knight - Official Trailer", image: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=500&q=80", embed: '<iframe src="https://www.youtube.com/embed/EXeTwQWrcwY" allowfullscreen></iframe>' },
            { id: 4, titleAr: "مستر روبوت - الموسم الأول", titleEn: "Mr. Robot - Season 1", image: "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=500&q=80", embed: '' },
            { id: 5, titleAr: "الجوكر - مشاهدة مباشرة", titleEn: "Joker - Watch Now", image: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=500&q=80", embed: '' },
            { id: 6, titleAr: "أشياء غريبة - الحلقة المنتظرة", titleEn: "Stranger Things - New Episode", image: "https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?w=500&q=80", embed: '' }
        ];

        let currentLang = 'ar';
        const homePage = document.getElementById('homePage');
        const playerPage = document.getElementById('playerPage');
        const homeList = document.getElementById('homeList');
        const suggestionsList = document.getElementById('suggestionsList');
        const videoContainer = document.getElementById('videoContainer');
        const playerTitle = document.getElementById('playerTitle');
        const suggestionsTitle = document.getElementById('suggestionsTitle');
        const searchInput = document.getElementById('searchInput');
        const langToggle = document.getElementById('langToggle');

        // دالة موحدة لإنشاء كارت الفيديو العريض
        function createMovieCard(movie) {
            const title = currentLang === 'ar' ? movie.titleAr : movie.titleEn;
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.innerHTML = `
                <div class="thumbnail-wrapper">
                    <img src="${movie.image}" alt="${title}">
                </div>
                <div class="movie-info">
                    <div class="movie-title">${title}</div>
                </div>
            `;
            // عند الضغط، انتقل لصفحة المشغل
            card.addEventListener('click', () => openPlayerPage(movie));
            return card;
        }

        // دالة لعرض القائمة الرئيسية (الآن رأسية كبيرة)
function renderHomeList() {
	homeList.innerHTML = '';
  allMovies.forEach(movie => {
  homeList.appendChild(createMovieCard(movie));
	});
	}

	  // دالة لعرض القائمة المقترحة في صفحة المشغل (أيضاً رأسية)
	  function renderSuggestionsList(currentMovieId) {
	  suggestionsList.innerHTML = '';
	  // عرض كل الفيديوهات ماعدا الحالي
	  const suggestedMovies = allMovies.filter(movie => movie.id !== currentMovieId);
		suggestedMovies.forEach(movie => {
		suggestionsList.appendChild(createMovieCard(movie));
	  });
	  }

	  // دالة الانتقال لصفحة المشغل
	function openPlayerPage(movie) {
	homePage.style.display = 'none';
	playerPage.style.display = 'flex';

	// تحميل الفيديو والعنوان
	  videoContainer.innerHTML = movie.embed || '<div style="color:white; padding:20px; text-align:center;">عفواً، رابط الفيديو غير متوفر لهذا العنصر.</div>';
	  playerTitle.textContent = currentLang === 'ar' ? movie.titleAr : movie.titleEn;

	  // تحميل المقترحات في الأسفل بنفس التنسيق الرأسي
	  renderSuggestionsList(movie.id);

	  // الصعود لأعلى الصفحة (لبداية المشغل)
	window.scrollTo(0, 0);
	}

	// العودة للرئيسية عند الضغط على اللوجو
	document.getElementById('logoLink').addEventListener('click', (e) => {
	  e.preventDefault();
	  homePage.style.display = 'block';
	  playerPage.style.display = 'none';
	  videoContainer.innerHTML = ''; // إيقاف الفيديو الحالي
	  renderHomeList();
		window.scrollTo(0, 0);
        });

        // تغيير اللغة
        langToggle.addEventListener('click', () => {
		if (currentLang === 'ar') {
		currentLang = 'en';
		  document.documentElement.setAttribute('dir', 'ltr');
		  langToggle.textContent = 'العربية';
		searchInput.placeholder = 'Search...';
	  suggestionsTitle.textContent = 'Videos You May Like';
	} else {
	currentLang = 'ar';
	document.documentElement.setAttribute('dir', 'rtl');
	langToggle.textContent = 'English';
	searchInput.placeholder = 'ابحث...';
	suggestionsTitle.textContent = 'فيديوهات قد تعجبك';
	}
// إعادة تحميل القائمة الظاهرة حالياً باللغة الجديدة
            if (homePage.style.display !== 'none') {
 renderHomeList();
 } else {
 // ملاحظة: لتبسيط الكود، لا يتم تحديث عنوان الفيديو الحالي في المشغل عند تغيير اللغة
 renderSuggestionsList();
 }
 });

 // التشغيل الأولي (القائمة الرئيسية الكبيرة)
 renderHomeList();
 </script>
 </body>
</html>
